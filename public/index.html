<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Upload a file, get a public link." />
    <title>files.lbgos.dev</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>files.lbgos.dev</h1>
        <a href="https://lbgos.dev">lbgos.dev</a>
      </header>

      <label class="token">
        <span>token</span>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="paste upload token" />
        <button id="toggle-token" type="button" aria-pressed="false">show</button>
      </label>

      <button id="drop-zone" class="drop" type="button">
        drop, paste or <u>choose</u> files <span>· links are public</span>
      </button>
      <input id="file-input" type="file" multiple hidden />

      <ol id="upload-list" class="uploads" aria-live="polite"></ol>
    </main>
  </body>
</html>
