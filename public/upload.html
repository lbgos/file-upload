<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>files.lbgos.dev</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>files.lbgos.dev</h1>
        <nav>
          <a href="https://github.com/lbgos/file-upload">github</a>
          <button id="sign-out" type="button">sign out</button>
        </nav>
      </header>

      <button id="drop-zone" class="drop" type="button">
        Drop, paste or <u>choose</u> files. Links are public.
      </button>
      <input id="file-input" type="file" multiple hidden />

      <ol id="upload-list" class="uploads" aria-live="polite"></ol>
    </main>
  </body>
</html>
